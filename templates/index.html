        /* Green scanline overlay for matrix feel */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 3px,
                rgba(0, 255, 70, 0.015) 3px,
                rgba(0, 255, 70, 0.015) 4px
            );
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 820px;
            margin: 0 auto;
            padding: 48px 24px 60px;
        }

        h1 {
            font-family: 'Share Tech Mono', monospace;
            font-size: 2rem;
            font-weight: 400;
            color: #00ff46;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
            text-shadow: 0 0 18px rgba(0,255,70,0.4);
        }

        .subtitle {
            font-size: 1rem;
            color: rgba(0, 255, 70, 0.55);
            font-family: 'Share Tech Mono', monospace;
            margin-bottom: 36px;
            letter-spacing: 0.04em;
        }

        /* Input row */
        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 28px;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            font-size: 15px;
            font-family: 'Share Tech Mono', monospace;
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(0, 255, 70, 0.35);
            border-radius: 6px;
            color: #d0ffd0;
            outline: none;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder { color: rgba(0, 255, 70, 0.3); }

        input:focus {
            border-color: rgba(0, 255, 70, 0.8);
            box-shadow: 0 0 12px rgba(0, 255, 70, 0.2);
            background: rgba(0, 0, 0, 0.25);
        }

        button {
            padding: 12px 24px;
            font-size: 14px;
            font-family: 'Share Tech Mono', monospace;
            background: rgba(0, 255, 70, 0.12);
            color: #00ff46;
            border: 1px solid rgba(0, 255, 70, 0.6);
            border-radius: 6px;
            cursor: pointer;
            letter-spacing: 0.06em;
            transition: background 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }

        button:hover {
            background: rgba(0, 255, 70, 0.22);
            box-shadow: 0 0 16px rgba(0, 255, 70, 0.25);
        }

        #loading {
            display: none;
            font-family: 'Share Tech Mono', monospace;
            color: rgba(0, 255, 70, 0.6);
            font-size: 14px;
            margin-bottom: 20px;
            letter-spacing: 0.05em;
        }

        /* Summary */
        #result h2 {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            color: #00ff46;
            letter-spacing: 0.1em;
            margin: 28px 0 12px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .summary-point {
            background: rgba(0, 0, 0, 0.45);
            border-left: 3px solid rgba(0, 255, 70, 0.6);
            padding: 10px 16px;
            margin: 8px 0;
            border-radius: 0 6px 6px 0;
            font-size: 15px;
            color: #c8f5c8;
            line-height: 1.6;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        /* Quiz cards */
        .quiz-card {
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(0, 255, 70, 0.2);
            border-radius: 10px;
            padding: 20px 22px;
            margin: 14px 0;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .quiz-card p {
            font-size: 16px;
            color: #d8ffd8;
            margin-bottom: 14px;
            line-height: 1.5;
            font-weight: 600;
        }

        .option {
            padding: 9px 14px;
            margin: 6px 0;
            border: 1px solid rgba(0, 255, 70, 0.2);
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: #b0e8b0;
            background: rgba(0, 255, 70, 0.04);
            transition: background 0.15s, border-color 0.15s;
            font-family: 'Rajdhani', sans-serif;
        }

        .option:hover {
            background: rgba(0, 255, 70, 0.1);
            border-color: rgba(0, 255, 70, 0.45);
        }

        .correct {
            background: rgba(0, 200, 80, 0.22) !important;
            border-color: #00c850 !important;
            color: #afffcf !important;
        }

        .wrong {
            background: rgba(255, 50, 50, 0.18) !important;
            border-color: rgba(255, 80, 80, 0.6) !important;
            color: #ffb0b0 !important;
        }

        .error-msg { color: #ff6b6b; font-family: 'Share Tech Mono', monospace; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1> Video Summariser and Evaluator</h1>
        <p class="subtitle"> paste a link. get a summary. take the quiz.</p>

        <div class="input-row">
            <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=..." />
            <button onclick="generate()"> GENERATE </button>
        </div>

        <div id="loading">&#x25B6; fetching transcript and generating quiz</div>
        <div id="result"></div>
    </div>

    <script>
        async function generate() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) { alert('Please paste a YouTube URL'); return; }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').innerHTML = '';

            const response = await fetch('/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            });

            const data = await response.json();
            document.getElementById('loading').style.display = 'none';

            if (data.error) {
                document.getElementById('result').innerHTML = '<p class="error-msg">&#x25A0; ERROR: ' + data.error + '</p>';
                return;
            }

            let html = '<h2> Summary </h2>';
            data.summary.forEach(point => {
                html += '<div class="summary-point">&#x25B8; ' + point + '</div>';
            });

            html += '<h2> Quiz </h2>';
            data.quiz.forEach((q, i) => {
                html += '<div class="quiz-card"><p>Q' + (i+1) + '. ' + q.question + '</p>';
                Object.entries(q.options).forEach(([letter, text]) => {
                    html += '<div class="option" onclick="checkAnswer(this, \'' + letter + '\', \'' + q.answer + '\')">' + letter + '. ' + text + '</div>';
                });
                html += '</div>';
            });

            document.getElementById('result').innerHTML = html;
        }

        function checkAnswer(element, chosen, correct) {
            const card = element.parentElement;
            card.querySelectorAll('.option').forEach(opt => {
                opt.style.pointerEvents = 'none';
            });

            if (chosen === correct) {
                element.classList.add('correct');
                element.innerHTML += ' &#x2714; CORRECT';
            } else {
                element.classList.add('wrong');
                element.innerHTML += ' &#x2718; INCORRECT';
                card.querySelectorAll('.option').forEach(opt => {
                    if (opt.textContent.trim().startsWith(correct)) {
                        opt.classList.add('correct');
                    }
                });
            }
        }
    </script>
</body>
</html>
